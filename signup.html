<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign Up | SNK IT Institute</title>

  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg">

  <style>

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#050505;
      color:#fff;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;
    }

    a{ text-decoration:none; color:inherit; }

    .box{
      width:100%;
      max-width:400px;
      background:#0b0b0b;
      border:1px solid #202020;
      border-radius:18px;
      padding:36px 32px;
      box-shadow:0 25px 70px rgba(0,0,0,.3);
    }

    .logo{ width:110px; margin:0 auto 24px; }

    .box h1{ font-size:22px; text-align:center; margin-bottom:6px; }
    .box p.sub{ color:#777; font-size:13px; text-align:center; margin-bottom:28px; line-height:1.7; }

    .form-group{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
    .form-group label{ color:#ddd; font-size:13px; font-weight:700; }

    .form-group input{
      width:100%;
      border:1px solid #292929;
      outline:none;
      background:#101010;
      color:#fff;
      border-radius:9px;
      padding:13px 14px;
      font-size:13px;
      transition:.3s;
    }

    .form-group input:focus{
      border-color:rgba(183,255,0,.55);
      box-shadow:0 0 0 3px rgba(183,255,0,.05);
    }

    .form-group .hint{ color:#666; font-size:11px; line-height:1.5; }

    .submit-button{
      width:100%;
      margin-top:8px;
      padding:14px;
      border:0;
      border-radius:9px;
      background:#b7ff00;
      color:#050505;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      transition:.3s;
    }

    .submit-button:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 35px rgba(183,255,0,.20);
    }

    .submit-button:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .error-box, .success-box{
      display:none;
      margin-bottom:16px;
      padding:12px 14px;
      border-radius:9px;
      font-size:12.5px;
      line-height:1.6;
    }

    .error-box{
      background:rgba(255,80,80,.08);
      border:1px solid rgba(255,80,80,.3);
      color:#ff8080;
    }

    .success-box{
      background:rgba(183,255,0,.06);
      border:1px solid rgba(183,255,0,.3);
      color:#b7ff00;
    }

    .error-box.show, .success-box.show{ display:block; }

    .bottom-link{
      display:block;
      text-align:center;
      margin-top:22px;
      color:#777;
      font-size:12.5px;
    }

    .bottom-link a{ color:#b7ff00; font-weight:700; }

  </style>
</head>

<body>

  <div class="box">

    <img class="logo" src="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg" alt="SNK IT Institute">

    <h1>Student Account তৈরি করুন</h1>
    <p class="sub">
      ⚠️ Admission Form-এ যেই Email ব্যবহার করেছেন,
      ঠিক <strong>সেই একই Email</strong> দিয়ে account বানান —
      তাহলেই আপনার ভর্তির তথ্য Dashboard-এ দেখতে পাবেন।
    </p>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <form id="signupForm">

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="admission form-এ যেই email দিয়েছেন" required>
        <span class="hint">Admission form-এ ব্যবহার করা email-টাই দিন</span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="কমপক্ষে ৬ ডিজিট/অক্ষর" minlength="6" required>
      </div>

      <div class="form-group">
        <label>Password আবার লিখুন</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required>
      </div>

      <button type="submit" class="submit-button" id="signupBtn">
        Account তৈরি করুন →
      </button>

    </form>

    <span class="bottom-link">
      আগে থেকেই account আছে? <a href="student-login.html">Login করুন</a>
    </span>

  </div>


  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDapm0z0sAMjJKhEOWO7NlQKyjY0HgmXYA",
      authDomain: "snk-it-institute.firebaseapp.com",
      projectId: "snk-it-institute",
      storageBucket: "snk-it-institute.firebasestorage.app",
      messagingSenderId: "948436125833",
      appId: "1:948436125833:web:36788463d4dd3ef20bde58"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const signupForm = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");

    function showError(msg){
      errorBox.textContent = msg;
      errorBox.classList.add("show");
      successBox.classList.remove("show");
    }

    function showSuccess(msg){
      successBox.textContent = msg;
      successBox.classList.add("show");
      errorBox.classList.remove("show");
    }

    signupForm.addEventListener("submit", function(e){
      e.preventDefault();
      errorBox.classList.remove("show");
      successBox.classList.remove("show");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if(password !== confirmPassword){
        showError("দুইটা Password মিলছে না। আবার চেষ্টা করুন।");
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = "তৈরি হচ্ছে...";

      auth.createUserWithEmailAndPassword(email, password)
        .then(function(){
          showSuccess("Account তৈরি হয়ে গেছে! Dashboard-এ নিয়ে যাওয়া হচ্ছে...");
          setTimeout(function(){
            window.location.href = "student-dashboard.html";
          }, 1200);
        })
        .catch(function(error){
          signupBtn.disabled = false;
          signupBtn.textContent = "Account তৈরি করুন →";

          if(error.code === "auth/email-already-in-use"){
            showError("এই Email দিয়ে আগেই একটা account আছে। Login করুন।");
          }else if(error.code === "auth/invalid-email"){
            showError("সঠিক Email address দিন।");
          }else if(error.code === "auth/weak-password"){
            showError("Password কমপক্ষে ৬ ডিজিট/অক্ষরের হতে হবে।");
          }else{
            showError("সমস্যা হয়েছে: " + error.message);
          }
        });
    });

  </script>

</body>
</html>

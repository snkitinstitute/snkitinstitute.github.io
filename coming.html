<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেজ খুঁজে পাওয়া যায়নি | SNK IT Institute</title>

  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#050505;
      color:#fff;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      text-align:center;
      padding:25px;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .box{
      max-width:480px;
    }

    .brand-logo{
      width:100px;
      margin:0 auto 30px;
    }

    .code{
      font-size:70px;
      font-weight:900;
      color:#b7ff00;
      line-height:1;
      margin-bottom:14px;
    }

    h1{
      font-size:24px;
      margin-bottom:14px;
    }

    p{
      color:#999;
      font-size:14px;
      line-height:1.8;
      margin-bottom:26px;
    }

    .buttons{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-block;

      padding:13px 24px;

      border-radius:9px;

      font-size:13px;
      font-weight:800;

      transition:.3s;
    }

    .btn-primary{
      background:#b7ff00;
      color:#050505;
    }

    .btn-primary:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 35px rgba(183,255,0,.20);
    }

    .btn-secondary{
      border:1px solid #333;
      color:#fff;
    }

    .btn-secondary:hover{
      border-color:#b7ff00;
      color:#b7ff00;
    }

  </style>
</head>

<body>

  <div class="box">

    <img
      class="brand-logo"
      src="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg"
      alt="SNK IT Institute"
    >

    <div class="code">404</div>

    <h1>এই পেজটি খুঁজে পাওয়া যায়নি</h1>

    <p>
      আপনি যেই পেজটি খুঁজছেন সেটি হয়তো সরিয়ে ফেলা হয়েছে
      অথবা লিংকে ভুল আছে। হোমে ফিরে গিয়ে আবার চেষ্টা করুন।
    </p>

    <div class="buttons">

      <a href="/" class="btn btn-primary">
        হোমে ফিরে যান →
      </a>

      <a href="/courses/" class="btn btn-secondary">
        কোর্সসমূহ দেখুন
      </a>

    </div>

  </div>

</body>
</html>

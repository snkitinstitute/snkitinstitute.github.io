<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | SNK IT Institute</title>

  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg">

  <style>

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#050505;
      color:#fff;
      line-height:1.6;
    }

    a{ text-decoration:none; color:inherit; }
    button{ font:inherit; }

    .container{ width:min(700px,92%); margin:auto; }

    .header{
      display:flex; align-items:center; justify-content:space-between;
      padding:18px 0; border-bottom:1px solid #181818; margin-bottom:30px;
    }

    .brand{ display:flex; align-items:center; gap:10px; }
    .brand img{ width:34px; height:34px; }
    .brand span{ font-weight:800; font-size:14px; }

    .logout-btn{
      padding:9px 16px; border:1px solid #292929; border-radius:8px;
      background:#101010; color:#fff; font-size:12.5px; font-weight:700;
      cursor:pointer; transition:.3s;
    }
    .logout-btn:hover{ border-color:#ff8080; color:#ff8080; }

    .auth-gate{
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      color:#777; font-size:14px;
    }

    .page-body{ display:none; padding-bottom:60px; }

    .welcome{ margin-bottom:24px; }
    .welcome h1{ font-size:24px; margin-bottom:6px; }
    .welcome p{ color:#888; font-size:13.5px; }

    .profile-card{
      background:#0b0b0b; border:1px solid #202020; border-radius:18px;
      padding:28px; margin-bottom:20px;
    }

    .status-badge{
      display:inline-flex; align-items:center; gap:7px;
      padding:7px 14px; border-radius:50px;
      background:rgba(183,255,0,.08); border:1px solid rgba(183,255,0,.3);
      color:#b7ff00; font-size:12px; font-weight:800; margin-bottom:20px;
    }

    .detail-grid{
      display:grid; grid-template-columns:1fr 1fr; gap:18px;
    }

    .detail-item{ }
    .detail-item span{ display:block; color:#666; font-size:11.5px; margin-bottom:4px; }
    .detail-item strong{ font-size:14px; color:#fff; }

    .no-record{
      background:#0b0b0b; border:1px solid #202020; border-radius:18px;
      padding:40px 28px; text-align:center;
    }
    .no-record .icon{ font-size:40px; margin-bottom:14px; }
    .no-record h2{ font-size:18px; margin-bottom:10px; }
    .no-record p{ color:#888; font-size:13.5px; margin-bottom:20px; line-height:1.8; }

    .cta-btn{
      display:inline-block; padding:12px 22px;
      background:#b7ff00; color:#050505; border-radius:9px;
      font-size:13px; font-weight:800; transition:.3s;
    }
    .cta-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 25px rgba(183,255,0,.2); }

    @media(max-width:500px){
      .detail-grid{ grid-template-columns:1fr; }
    }

  </style>
</head>

<body>

  <div class="auth-gate" id="authGate">লোড হচ্ছে...</div>

  <div class="page-body" id="pageBody">

    <div class="container">

      <div class="header">
        <div class="brand">
          <img src="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg" alt="SNK">
          <span>Student Dashboard</span>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout →</button>
      </div>

      <div id="contentArea">
        <!-- filled by JS -->
      </div>

    </div>

  </div>


  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDapm0z0sAMjJKhEOWO7NlQKyjY0HgmXYA",
      authDomain: "snk-it-institute.firebaseapp.com",
      projectId: "snk-it-institute",
      storageBucket: "snk-it-institute.firebasestorage.app",
      messagingSenderId: "948436125833",
      appId: "1:948436125833:web:36788463d4dd3ef20bde58"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const authGate = document.getElementById("authGate");
    const pageBody = document.getElementById("pageBody");
    const contentArea = document.getElementById("contentArea");

    function escapeHtml(str){
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    auth.onAuthStateChanged(function(user){
      if(!user){
        window.location.href = "student-login.html";
        return;
      }

      authGate.style.display = "none";
      pageBody.style.display = "block";

      db.collection("students").where("email", "==", user.email).limit(1).get()
        .then(function(snapshot){

          if(snapshot.empty){
            contentArea.innerHTML = `
              <div class="no-record">
                <div class="icon">📋</div>
                <h2>কোনো Admission তথ্য পাওয়া যায়নি</h2>
                <p>
                  এই email (${escapeHtml(user.email)}) দিয়ে এখনো কোনো Admission Form
                  জমা দেওয়া হয়নি, অথবা ভিন্ন email দিয়ে জমা দিয়েছেন।
                  Admission Form-এ ঠিক এই email ব্যবহার করে আবার জমা দিন।
                </p>
                <a href="admission.html" class="cta-btn">Admission Form পূরণ করুন →</a>
              </div>
            `;
            return;
          }

          const data = snapshot.docs[0].data();

          contentArea.innerHTML = `
            <div class="welcome">
              <h1>স্বাগতম, ${escapeHtml(data.name || "শিক্ষার্থী")} 👋</h1>
              <p>আপনার ভর্তির তথ্য নিচে দেখতে পাচ্ছেন</p>
            </div>

            <div class="profile-card">

              <div class="status-badge">● Application Submitted</div>

              <div class="detail-grid">

                <div class="detail-item">
                  <span>পূর্ণ নাম</span>
                  <strong>${escapeHtml(data.name || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>মোবাইল নম্বর</span>
                  <strong>${escapeHtml(data.phone || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>Email</span>
                  <strong>${escapeHtml(data.email || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>বয়স</span>
                  <strong>${escapeHtml(data.age || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>নির্বাচিত কোর্স</span>
                  <strong>${escapeHtml(data.course || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>শিক্ষাগত যোগ্যতা</span>
                  <strong>${escapeHtml(data.education || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>বর্তমান পেশা</span>
                  <strong>${escapeHtml(data.profession || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>PC/Laptop</span>
                  <strong>${escapeHtml(data.pcLaptop || "-")}</strong>
                </div>

                <div class="detail-item">
                  <span>ঠিকানা</span>
                  <strong>${escapeHtml(data.address || "-")}</strong>
                </div>

              </div>

            </div>
          `;
        })
        .catch(function(error){
          contentArea.innerHTML = "<div class='no-record'><p>তথ্য লোড করতে সমস্যা হয়েছে: " + escapeHtml(error.message) + "</p></div>";
        });
    });

    document.getElementById("logoutBtn").addEventListener("click", function(){
      auth.signOut().then(function(){
        window.location.href = "student-login.html";
      });
    });

  </script>

</body>
</html>

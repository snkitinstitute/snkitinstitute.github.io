<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | SNK IT Institute</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg"
  >

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#050505;
      color:#fff;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:25px;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .login-box{
      width:100%;
      max-width:380px;

      background:#0b0b0b;
      border:1px solid #202020;
      border-radius:18px;

      padding:36px 32px;

      box-shadow:0 25px 70px rgba(0,0,0,.35);
    }

    .logo{
      display:block;
      width:110px;
      height:auto;
      margin:0 auto 24px;
    }

    h1{
      font-size:22px;
      text-align:center;
      margin-bottom:7px;
    }

    .sub{
      color:#777;
      font-size:13px;
      text-align:center;
      line-height:1.6;
      margin-bottom:28px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:7px;
      margin-bottom:16px;
    }

    .form-group label{
      color:#ddd;
      font-size:13px;
      font-weight:700;
    }

    .form-group input{
      width:100%;
      border:1px solid #292929;
      outline:none;

      background:#101010;
      color:#fff;

      border-radius:9px;
      padding:13px 14px;

      font-size:13px;

      transition:.25s;
    }

    .form-group input::placeholder{
      color:#555;
    }

    .form-group input:focus{
      border-color:rgba(183,255,0,.65);
      box-shadow:0 0 0 3px rgba(183,255,0,.06);
    }

    .login-button{
      width:100%;
      margin-top:8px;

      padding:14px;

      border:0;
      border-radius:9px;

      background:#b7ff00;
      color:#050505;

      font-size:14px;
      font-weight:900;

      cursor:pointer;
      transition:.25s;
    }

    .login-button:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 35px rgba(183,255,0,.20);
    }

    .login-button:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .error-box{
      display:none;

      margin-bottom:16px;
      padding:12px 14px;

      background:rgba(255,80,80,.08);
      border:1px solid rgba(255,80,80,.3);

      border-radius:9px;

      color:#ff8080;

      font-size:12.5px;
      line-height:1.6;
    }

    .error-box.show{
      display:block;
    }

    .success-box{
      display:none;

      margin-bottom:16px;
      padding:12px 14px;

      background:rgba(183,255,0,.06);
      border:1px solid rgba(183,255,0,.25);

      border-radius:9px;

      color:#b7ff00;

      font-size:12.5px;
      line-height:1.6;
    }

    .success-box.show{
      display:block;
    }

    .back-link{
      display:block;

      text-align:center;

      margin-top:22px;

      color:#777;

      font-size:12.5px;

      transition:.25s;
    }

    .back-link:hover{
      color:#b7ff00;
    }

    .firebase-status{
      margin-top:18px;

      text-align:center;

      color:#444;

      font-size:10px;
      line-height:1.5;
    }

    @media(max-width:480px){

      body{
        padding:16px;
      }

      .login-box{
        padding:30px 22px;
        border-radius:15px;
      }

      .logo{
        width:95px;
      }

      h1{
        font-size:20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img
      class="logo"
      src="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg"
      alt="SNK IT Institute"
    >

    <h1>Admin Login</h1>

    <p class="sub">
      শুধুমাত্র SNK IT Institute Admin-দের জন্য
    </p>

    <div class="error-box" id="errorBox"></div>

    <div class="success-box" id="successBox"></div>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="admin@example.com"
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginBtn"
      >
        Login →
      </button>

    </form>


    <a href="/" class="back-link">
      ← হোমে ফিরে যান
    </a>

    <div class="firebase-status">
      SNK IT Institute Admin System
    </div>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


  <script>

    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {
      apiKey: "AIzaSyDapm0z0sAMJjKhEOWO7NlQKyjY0HgmXYA",
      authDomain: "snk-it-institute.firebaseapp.com",
      projectId: "snk-it-institute",
      storageBucket: "snk-it-institute.firebasestorage.app",
      messagingSenderId: "948436125833",
      appId: "1:948436125833:web:36788463d4dd3ef20bde58"
    };


    /* =========================================
       INITIALIZE FIREBASE
    ========================================= */

    try{

      firebase.initializeApp(firebaseConfig);

    }catch(error){

      console.error("Firebase initialization error:", error);

    }


    const auth = firebase.auth();


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginForm = document.getElementById("loginForm");

    const loginBtn = document.getElementById("loginBtn");

    const errorBox = document.getElementById("errorBox");

    const successBox = document.getElementById("successBox");


    /* =========================================
       ERROR HANDLER
    ========================================= */

    function showError(message){

      successBox.classList.remove("show");

      errorBox.textContent = message;

      errorBox.classList.add("show");

    }


    function hideError(){

      errorBox.classList.remove("show");

      errorBox.textContent = "";

    }


    function showSuccess(message){

      errorBox.classList.remove("show");

      successBox.textContent = message;

      successBox.classList.add("show");

    }


    /* =========================================
       AUTH STATE
    ========================================= */

    auth.onAuthStateChanged(function(user){

      if(user){

        console.log("Already logged in:", user.email);

        window.location.href = "/admin-dashboard/";

      }

    });


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener("submit", async function(e){

      e.preventDefault();

      hideError();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if(!email){

        showError("Email address দিন।");

        return;

      }


      if(!password){

        showError("Password দিন।");

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent = "Logging in...";


      try{

        console.log("Login attempt:", email);


        const result =
          await auth.signInWithEmailAndPassword(
            email,
            password
          );


        console.log(
          "Login successful:",
          result.user.email
        );


        showSuccess(
          "Login সফল হয়েছে। Dashboard-এ নেওয়া হচ্ছে..."
        );


        loginBtn.textContent = "Success ✓";


        setTimeout(function(){

          window.location.href = "/admin-dashboard/";

        },700);


      }catch(error){

        console.error(
          "Firebase Login Error:",
          error
        );


        loginBtn.disabled = false;

        loginBtn.textContent = "Login →";


        switch(error.code){

          case "auth/invalid-email":

            showError(
              "Email address সঠিক নয়।"
            );

            break;


          case "auth/user-not-found":

            showError(
              "এই Email দিয়ে কোনো Admin account পাওয়া যায়নি।"
            );

            break;


          case "auth/wrong-password":

            showError(
              "Password সঠিক নয়।"
            );

            break;


          case "auth/invalid-credential":

            showError(
              "Email অথবা Password সঠিক নয়।"
            );

            break;


          case "auth/user-disabled":

            showError(
              "এই Admin account Firebase থেকে Disabled করা হয়েছে।"
            );

            break;


          case "auth/too-many-requests":

            showError(
              "অনেকবার login চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"
            );

            break;


          case "auth/network-request-failed":

            showError(
              "Internet connection সমস্যা হয়েছে। আবার চেষ্টা করুন।"
            );

            break;


          case "auth/operation-not-allowed":

            showError(
              "Firebase-এ Email/Password Login চালু করা নেই।"
            );

            break;


          case "auth/app-not-authorized":

            showError(
              "এই website domain Firebase Authentication-এর জন্য অনুমোদিত নয়।"
            );

            break;


          default:

            showError(
              "Login করতে সমস্যা হয়েছে। Error: " +
              (error.code || "unknown")
            );

        }

      }

    });

  </script>

</body>
</html>

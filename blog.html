  <style>

    /* =====================================================
       RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    :root{
      --bg:#050505;
      --bg-alt:#080808;
      --bg-card:#0b0b0b;
      --bg-input:#101010;
      --text:#fff;
      --text-muted:#a4a4a4;
      --text-dim:#777;
      --border:#181818;
      --border-2:#292929;
    }

    html.light-mode{
      --bg:#f7f7f2;
      --bg-alt:#f0f0ea;
      --bg-card:#ffffff;
      --bg-input:#ffffff;
      --text:#111;
      --text-muted:#555;
      --text-dim:#777;
      --border:#e2e2da;
      --border-2:#dcdcd2;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
      overflow-x:hidden;
      transition:background .3s ease, color .3s ease;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      max-width:100%;
      display:block;
    }

    button{
      font:inherit;
    }

    .container{
      width:min(1000px,92%);
      margin:auto;
    }


    /* =====================================================
       HEADER (same as other pages)
    ===================================================== */

    .header{
      position:sticky;
      top:0;
      z-index:9999;

      background:var(--bg);
      opacity:.98;

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      border-bottom:1px solid var(--border);

      transition:background .3s ease, border-color .3s ease;
    }

    .nav{
      min-height:82px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:22px;
    }

    .brand{
      display:flex;
      align-items:center;
      flex-shrink:0;
    }

    .brand img{
      width:120px;
      height:auto;
    }

    .menu{
      display:flex;
      align-items:center;
      gap:25px;
    }

    .menu a{
      color:var(--text-muted);
      font-size:14px;
      transition:.3s;
    }

    .menu a:hover,
    .menu a.active{
      color:#b7ff00;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
    }

    .theme-toggle,
    .lang-toggle{
      display:flex;
      align-items:center;
      justify-content:center;

      width:40px;
      height:40px;

      border:1px solid var(--border-2);

      border-radius:8px;

      background:var(--bg-input);

      color:var(--text);

      font-size:15px;
      font-weight:800;

      cursor:pointer;

      transition:.3s;
    }

    .lang-toggle{
      width:auto;
      padding:0 12px;
      font-size:12px;
    }

    .theme-toggle:hover,
    .lang-toggle:hover{
      border-color:#b7ff00;
      color:#b7ff00;
    }

    .login-button{
      background:#b7ff00;
      color:#050505;

      padding:10px 17px;

      border-radius:8px;

      font-size:13px;
      font-weight:800;

      transition:.3s;
    }

    .login-button:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 30px rgba(183,255,0,.20);
    }


    /* =====================================================
       PAGE HERO
    ===================================================== */

    .page-hero{
      position:relative;

      padding:70px 0 45px;

      text-align:center;

      overflow:hidden;

      background:
        radial-gradient(
          circle at center,
          rgba(183,255,0,.10),
          transparent 40%
        ),
        var(--bg);

      transition:background .3s ease;
    }

    .page-badge{
      display:inline-flex;

      align-items:center;
      gap:8px;

      color:#b7ff00;

      padding:8px 15px;

      border:1px solid rgba(183,255,0,.25);

      background:rgba(183,255,0,.06);

      border-radius:50px;

      font-size:11px;
      font-weight:800;

      letter-spacing:1px;

      margin-bottom:20px;
    }

    .page-hero h1{
      font-size:clamp(34px,5vw,52px);

      line-height:1.15;

      letter-spacing:-2px;

      margin-bottom:14px;
    }

    .page-hero h1 span{
      color:#b7ff00;
    }

    .page-hero p{
      max-width:600px;

      margin:auto;

      color:var(--text-muted);

      font-size:15px;
    }


    /* =====================================================
       BLOG LIST
    ===================================================== */

    .blog-section{
      padding:50px 0 90px;
    }

    .blog-grid{
      display:grid;

      grid-template-columns:repeat(2,1fr);

      gap:22px;
    }

    .blog-card{
      background:var(--bg-card);

      border:1px solid var(--border-2);

      border-radius:16px;

      overflow:hidden;

      transition:.3s;
    }

    .blog-card:hover{
      border-color:rgba(183,255,0,.35);

      transform:translateY(-4px);
    }

    .blog-image{
      width:100%;

      height:190px;

      object-fit:cover;

      background:var(--bg-alt);
    }

    .blog-body{
      padding:22px;
    }

    .blog-date{
      color:#b7ff00;

      font-size:11px;

      font-weight:800;

      letter-spacing:1px;

      margin-bottom:10px;
      display:block;
    }

    .blog-card h2{
      font-size:19px;

      line-height:1.4;

      margin-bottom:10px;
    }

    .blog-excerpt{
      color:var(--text-muted);

      font-size:13.5px;

      line-height:1.8;

      margin-bottom:16px;
    }

    .read-more-btn{
      display:inline-flex;
      align-items:center;
      gap:6px;

      background:none;
      border:0;

      color:#b7ff00;

      font-size:13px;
      font-weight:800;

      cursor:pointer;
    }

    .read-more-btn:hover{
      text-decoration:underline;
    }

    .blog-full{
      display:none;

      margin-top:18px;

      padding-top:18px;

      border-top:1px solid var(--border-2);

      color:var(--text-muted);

      font-size:14px;

      line-height:1.9;
    }

    .blog-full.open{
      display:block;
    }

    .blog-full p{
      margin-bottom:14px;
    }


    /* EMPTY STATE (shown if no posts yet) */

    .empty-state{
      display:none;

      text-align:center;

      padding:60px 20px;

      color:var(--text-dim);

      font-size:14px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:900px){

      .menu{
        display:none;
      }

    }

    @media(max-width:700px){

      .container{
        width:90%;
      }

      .nav{
        min-height:70px;
      }

      .brand img{
        width:105px;
      }

      .blog-grid{
        grid-template-columns:1fr;
      }

      .page-hero{
        padding:55px 0 35px;
      }

    }

  
    /* FLOATING WHATSAPP BUTTON */

    .whatsapp-float{
      position:fixed;
      bottom:22px;
      right:22px;
      z-index:9998;

      width:56px;
      height:56px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#25D366;
      border-radius:50%;

      box-shadow:0 8px 24px rgba(0,0,0,.3);

      font-size:28px;

      transition:.3s;
    }

    .whatsapp-float:hover{
      transform:scale(1.1);
      box-shadow:0 10px 30px rgba(37,211,102,.4);
    }

    @media(max-width:600px){
      .whatsapp-float{
        width:50px;
        height:50px;
        bottom:16px;
        right:16px;
        font-size:24px;
      }
    }

  </style>

  <!-- =====================================================
       BLOG POSTS

       এখন থেকে পোস্ট Firestore ডাটাবেজ থেকে লোড হবে।
       নতুন পোস্ট যোগ/এডিট/ডিলিট করতে admin.html দিয়ে
       লগইন করে admin-dashboard.html ব্যবহার করুন।
  ===================================================== -->

  <section class="blog-section">

    <div class="container">

      <div class="blog-grid" id="blogGrid">
      </div>


      <div class="empty-state" id="emptyState">
        এখনো কোনো ব্লগ পোস্ট যোগ করা হয়নি। শীঘ্রই আসছে!
      </div>

    </div>

  </section>



      <div class="empty-state" id="emptyState">
        এখনো কোনো ব্লগ পোস্ট যোগ করা হয়নি। শীঘ্রই আসছে!
      </div>

    </div>

  </section>


  <!-- =====================================================
       SCRIPTS
  ===================================================== -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    /* THEME TOGGLE */

    const themeToggleBtn =
      document.getElementById("themeToggle");

    const htmlEl =
      document.documentElement;


    function applyTheme(theme){

      if(theme === "light"){

        htmlEl.classList.add("light-mode");
        themeToggleBtn.textContent = "☀️";

      }else{

        htmlEl.classList.remove("light-mode");
        themeToggleBtn.textContent = "🌙";

      }

    }


    applyTheme(localStorage.getItem("snk-theme") || "dark");


    themeToggleBtn.addEventListener("click", function(){

      const isLight =
        htmlEl.classList.contains("light-mode");

      const newTheme =
        isLight ? "dark" : "light";

      applyTheme(newTheme);

      localStorage.setItem("snk-theme", newTheme);

    });


    /* LANGUAGE TOGGLE */

    const langToggleBtn =
      document.getElementById("langToggle");


    function applyLang(lang){

      document.querySelectorAll("[data-bn]").forEach(function(el){

        el.textContent =
          (lang === "bn")
            ? el.getAttribute("data-bn")
            : el.getAttribute("data-en");

      });

      langToggleBtn.textContent =
        (lang === "bn") ? "EN" : "বাংলা";

    }


    applyLang(localStorage.getItem("snk-lang") || "bn");


    langToggleBtn.addEventListener("click", function(){

      const current =
        localStorage.getItem("snk-lang") || "bn";

      const next =
        (current === "bn") ? "en" : "bn";

      applyLang(next);

      localStorage.setItem("snk-lang", next);

    });


    /* BLOG READ MORE TOGGLE */

    function toggleBlogPost(id){

      const el = document.getElementById(id);

      const btn = el.previousElementSibling;

      const isOpen = el.classList.toggle("open");

      btn.textContent =
        isOpen ? "লেখাটি বন্ধ করুন ↑" : "পুরোটা পড়ুন →";

    }


    /* LOAD POSTS FROM FIRESTORE */

    const firebaseConfig = {
      apiKey: "AIzaSyDapm0z0sAMjJKhEOWO7NlQKyjY0HgmXYA",
      authDomain: "snk-it-institute.firebaseapp.com",
      projectId: "snk-it-institute",
      storageBucket: "snk-it-institute.firebasestorage.app",
      messagingSenderId: "948436125833",
      appId: "1:948436125833:web:36788463d4dd3ef20bde58"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const blogGrid = document.getElementById("blogGrid");
    const emptyState = document.getElementById("emptyState");

    function escapeHtml(str){
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function formatDate(timestamp){
      if(!timestamp || !timestamp.toDate) return "";
      const d = timestamp.toDate();
      const months = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
      return d.getDate() + " " + months[d.getMonth()] + ", " + d.getFullYear();
    }

    db.collection("posts").orderBy("createdAt", "desc").get().then(function(snapshot){

      if(snapshot.empty){
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      snapshot.forEach(function(doc){
        const post = doc.data();
        const postId = "post-" + doc.id;

        const imgSrc = post.image || "https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/blog-placeholder-1.jpg";

        const paragraphs = (post.content || "")
          .split(/\n\s*\n/)
          .filter(p => p.trim() !== "")
          .map(p => "<p>" + escapeHtml(p.trim()) + "</p>")
          .join("");

        const card = document.createElement("article");
        card.className = "blog-card";
        card.innerHTML = `
          <img class="blog-image" src="${imgSrc}" alt="Blog Post Image">
          <div class="blog-body">
            <span class="blog-date">${formatDate(post.createdAt)}</span>
            <h2>${escapeHtml(post.title)}</h2>
            <p class="blog-excerpt">${escapeHtml(post.excerpt)}</p>
            <button class="read-more-btn" onclick="toggleBlogPost('${postId}')">পুরোটা পড়ুন →</button>
            <div class="blog-full" id="${postId}">${paragraphs}</div>
          </div>
        `;
        blogGrid.appendChild(card);
      });

    }).catch(function(error){
      blogGrid.innerHTML = "";
      emptyState.style.display = "block";
      emptyState.textContent = "পোস্ট লোড করতে সমস্যা হয়েছে।";
      console.error(error);
    });

  </script>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | SNK IT Institute</title>

  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg">

  <style>

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#050505;
      color:#fff;
      line-height:1.6;
    }

    a{ text-decoration:none; color:inherit; }
    button, input, textarea{ font:inherit; }

    .container{ width:min(1100px,94%); margin:auto; }

    /* HEADER */

    .admin-header{
      position:sticky; top:0; z-index:999;
      background:rgba(5,5,5,.96);
      backdrop-filter:blur(14px);
      border-bottom:1px solid #181818;
      padding:16px 0;
    }

    .admin-header .container{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }

    .admin-brand{ display:flex; align-items:center; gap:10px; }
    .admin-brand img{ width:36px; height:36px; }
    .admin-brand span{ font-weight:800; font-size:15px; }

    .logout-btn{
      padding:9px 16px;
      border:1px solid #292929;
      border-radius:8px;
      background:#101010;
      color:#fff;
      font-size:12.5px;
      font-weight:700;
      cursor:pointer;
      transition:.3s;
    }
    .logout-btn:hover{ border-color:#ff8080; color:#ff8080; }

    /* LOADING GATE */

    .auth-gate{
      min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      color:#777; font-size:14px;
    }

    .dashboard-body{ display:none; padding:30px 0 80px; }

    /* TABS */

    .tabs{
      display:flex; gap:10px; margin-bottom:26px;
      border-bottom:1px solid #181818;
    }

    .tab-btn{
      padding:12px 18px;
      background:none; border:0;
      color:#777; font-size:14px; font-weight:700;
      cursor:pointer;
      border-bottom:2px solid transparent;
      transition:.3s;
    }

    .tab-btn.active{ color:#b7ff00; border-color:#b7ff00; }

    .tab-panel{ display:none; }
    .tab-panel.active{ display:block; }

    /* SECTION HEADER */

    .section-head{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:20px; flex-wrap:wrap; gap:10px;
    }

    .section-head h2{ font-size:19px; }
    .section-head span{ color:#777; font-size:12.5px; }

    .primary-btn{
      padding:11px 18px;
      background:#b7ff00; color:#050505;
      border:0; border-radius:8px;
      font-size:13px; font-weight:800;
      cursor:pointer; transition:.3s;
    }
    .primary-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 25px rgba(183,255,0,.2); }

    /* POST FORM */

    .post-form{
      display:none;
      background:#0b0b0b; border:1px solid #202020; border-radius:16px;
      padding:24px; margin-bottom:24px;
    }
    .post-form.open{ display:block; }

    .form-row{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
    .form-row label{ font-size:12.5px; font-weight:700; color:#ddd; }

    .form-row input, .form-row textarea{
      width:100%; border:1px solid #292929; outline:none;
      background:#101010; color:#fff; border-radius:9px;
      padding:12px 13px; font-size:13px; transition:.3s;
    }
    .form-row input:focus, .form-row textarea:focus{
      border-color:rgba(183,255,0,.5); box-shadow:0 0 0 3px rgba(183,255,0,.05);
    }
    .form-row textarea{ min-height:80px; resize:vertical; }
    .form-row .hint{ color:#666; font-size:11px; }

    .form-actions{ display:flex; gap:10px; margin-top:6px; }

    .secondary-btn{
      padding:11px 18px;
      background:none; color:#999;
      border:1px solid #292929; border-radius:8px;
      font-size:13px; font-weight:700;
      cursor:pointer; transition:.3s;
    }
    .secondary-btn:hover{ border-color:#555; color:#fff; }

    /* POST LIST */

    .post-item{
      display:flex; gap:16px; align-items:flex-start;
      background:#0b0b0b; border:1px solid #202020; border-radius:14px;
      padding:16px; margin-bottom:12px;
    }
    .post-item img{
      width:80px; height:60px; object-fit:cover; border-radius:8px;
      background:#161616; flex-shrink:0;
    }
    .post-item .post-info{ flex:1; min-width:0; }
    .post-item h3{ font-size:14.5px; margin-bottom:4px; }
    .post-item p{ color:#888; font-size:12.5px; }
    .post-item .post-actions{ display:flex; gap:8px; flex-shrink:0; }

    .icon-btn{
      width:32px; height:32px; border-radius:7px;
      border:1px solid #292929; background:#101010; color:#999;
      cursor:pointer; font-size:13px; transition:.3s;
    }
    .icon-btn:hover{ border-color:#b7ff00; color:#b7ff00; }
    .icon-btn.danger:hover{ border-color:#ff8080; color:#ff8080; }

    .empty-note{ color:#666; font-size:13px; padding:20px; text-align:center; }

    /* STUDENT TABLE */

    .student-list{ display:flex; flex-direction:column; gap:10px; }

    .student-card{
      background:#0b0b0b; border:1px solid #202020; border-radius:14px;
      padding:16px 18px;
      display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr auto; gap:14px; align-items:center;
    }

    .student-card .s-name{ font-weight:700; font-size:13.5px; }
    .student-card .s-sub{ color:#777; font-size:11.5px; margin-top:2px; }
    .student-card .s-field{ font-size:12.5px; color:#ccc; }
    .student-card .s-field span{ display:block; color:#666; font-size:10.5px; margin-bottom:2px; }

    @media(max-width:800px){
      .student-card{ grid-template-columns:1fr 1fr; }
    }

  </style>
</head>

<body>

  <div class="auth-gate" id="authGate">লোড হচ্ছে...</div>

  <div class="dashboard-body" id="dashboardBody">

    <header class="admin-header">
      <div class="container">
        <div class="admin-brand">
          <img src="https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/snk%20itlogo%20tn.svg" alt="SNK">
          <span>Admin Dashboard</span>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout →</button>
      </div>
    </header>

    <div class="container">

      <div class="tabs">
        <button class="tab-btn active" data-tab="posts">ব্লগ পোস্ট</button>
        <button class="tab-btn" data-tab="students">Admission তালিকা</button>
      </div>


      <!-- BLOG POSTS TAB -->

      <div class="tab-panel active" id="tab-posts">

        <div class="section-head">
          <div>
            <h2>ব্লগ পোস্ট</h2>
            <span>এখান থেকে যোগ/এডিট/ডিলিট করলে blog.html-এ সাথে সাথে দেখা যাবে</span>
          </div>
          <button class="primary-btn" id="newPostBtn">+ নতুন পোস্ট</button>
        </div>

        <form class="post-form" id="postForm">

          <input type="hidden" id="postId">

          <div class="form-row">
            <label>টাইটেল *</label>
            <input type="text" id="postTitle" required placeholder="যেমন: কেন AI Skill শেখা জরুরি">
          </div>

          <div class="form-row">
            <label>ছবির লিংক</label>
            <input type="text" id="postImage" placeholder="https://... (খালি রাখলে default দেখাবে)">
          </div>

          <div class="form-row">
            <label>ছোট বিবরণ (Excerpt) *</label>
            <textarea id="postExcerpt" required placeholder="২-৩ লাইনের সংক্ষিপ্ত বিবরণ..."></textarea>
          </div>

          <div class="form-row">
            <label>পুরো লেখা *</label>
            <textarea id="postContent" required style="min-height:160px;" placeholder="পুরো লেখা লিখুন। একটা প্যারাগ্রাফ শেষ করে একটা ফাঁকা লাইন রেখে পরের প্যারাগ্রাফ লিখুন।"></textarea>
            <span class="hint">প্রতিটা প্যারাগ্রাফের মাঝে একটা ফাঁকা লাইন রাখবেন</span>
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-btn" id="savePostBtn">পোস্ট সেভ করুন</button>
            <button type="button" class="secondary-btn" id="cancelPostBtn">বাতিল</button>
          </div>

        </form>

        <div id="postList"></div>
        <div class="empty-note" id="postsEmpty" style="display:none;">এখনো কোনো পোস্ট যোগ করা হয়নি।</div>

      </div>


      <!-- STUDENTS TAB -->

      <div class="tab-panel" id="tab-students">

        <div class="section-head">
          <div>
            <h2>Admission তালিকা</h2>
            <span>admission.html ফর্ম থেকে জমা হওয়া সব আবেদন</span>
          </div>
        </div>

        <div class="student-list" id="studentList"></div>
        <div class="empty-note" id="studentsEmpty" style="display:none;">এখনো কোনো আবেদন জমা হয়নি।</div>

      </div>

    </div>

  </div>


  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDapm0z0sAMjJKhEOWO7NlQKyjY0HgmXYA",
      authDomain: "snk-it-institute.firebaseapp.com",
      projectId: "snk-it-institute",
      storageBucket: "snk-it-institute.firebasestorage.app",
      messagingSenderId: "948436125833",
      appId: "1:948436125833:web:36788463d4dd3ef20bde58"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const authGate = document.getElementById("authGate");
    const dashboardBody = document.getElementById("dashboardBody");

    // AUTH GUARD
    auth.onAuthStateChanged(function(user){
      if(user){
        authGate.style.display = "none";
        dashboardBody.style.display = "block";
        loadPosts();
        loadStudents();
      }else{
        window.location.href = "admin.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", function(){
      auth.signOut().then(function(){
        window.location.href = "admin.html";
      });
    });

    // TABS
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    // POST FORM TOGGLE
    const postForm = document.getElementById("postForm");
    const newPostBtn = document.getElementById("newPostBtn");
    const cancelPostBtn = document.getElementById("cancelPostBtn");

    function resetForm(){
      document.getElementById("postId").value = "";
      document.getElementById("postTitle").value = "";
      document.getElementById("postImage").value = "";
      document.getElementById("postExcerpt").value = "";
      document.getElementById("postContent").value = "";
      document.getElementById("savePostBtn").textContent = "পোস্ট সেভ করুন";
    }

    newPostBtn.addEventListener("click", function(){
      resetForm();
      postForm.classList.add("open");
    });

    cancelPostBtn.addEventListener("click", function(){
      postForm.classList.remove("open");
      resetForm();
    });

    // SAVE POST (create or update)
    document.getElementById("postForm").addEventListener("submit", function(e){
      e.preventDefault();

      const id = document.getElementById("postId").value;
      const data = {
        title: document.getElementById("postTitle").value.trim(),
        image: document.getElementById("postImage").value.trim(),
        excerpt: document.getElementById("postExcerpt").value.trim(),
        content: document.getElementById("postContent").value.trim(),
      };

      const saveBtn = document.getElementById("savePostBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "সেভ হচ্ছে...";

      let promise;
      if(id){
        promise = db.collection("posts").doc(id).update(data);
      }else{
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        promise = db.collection("posts").add(data);
      }

      promise.then(function(){
        saveBtn.disabled = false;
        postForm.classList.remove("open");
        resetForm();
        loadPosts();
      }).catch(function(error){
        saveBtn.disabled = false;
        saveBtn.textContent = "পোস্ট সেভ করুন";
        alert("সমস্যা হয়েছে: " + error.message);
      });
    });

    // LOAD POSTS
    function loadPosts(){
      const postList = document.getElementById("postList");
      const postsEmpty = document.getElementById("postsEmpty");

      db.collection("posts").orderBy("createdAt", "desc").get().then(function(snapshot){
        postList.innerHTML = "";

        if(snapshot.empty){
          postsEmpty.style.display = "block";
          return;
        }
        postsEmpty.style.display = "none";

        snapshot.forEach(function(doc){
          const post = doc.data();
          const item = document.createElement("div");
          item.className = "post-item";

          const imgSrc = post.image || "https://raw.githubusercontent.com/snkitinstitute/AssetsandProducts/main/blog-placeholder-1.jpg";

          item.innerHTML = `
            <img src="${imgSrc}" alt="">
            <div class="post-info">
              <h3>${escapeHtml(post.title || "")}</h3>
              <p>${escapeHtml((post.excerpt || "").slice(0,90))}</p>
            </div>
            <div class="post-actions">
              <button class="icon-btn" data-edit="${doc.id}" title="Edit">✎</button>
              <button class="icon-btn danger" data-delete="${doc.id}" title="Delete">🗑</button>
            </div>
          `;
          postList.appendChild(item);
        });

        // attach edit/delete handlers
        postList.querySelectorAll("[data-edit]").forEach(function(btn){
          btn.addEventListener("click", function(){
            const id = btn.getAttribute("data-edit");
            db.collection("posts").doc(id).get().then(function(doc){
              const post = doc.data();
              document.getElementById("postId").value = id;
              document.getElementById("postTitle").value = post.title || "";
              document.getElementById("postImage").value = post.image || "";
              document.getElementById("postExcerpt").value = post.excerpt || "";
              document.getElementById("postContent").value = post.content || "";
              document.getElementById("savePostBtn").textContent = "আপডেট করুন";
              postForm.classList.add("open");
              window.scrollTo({top:0, behavior:"smooth"});
            });
          });
        });

        postList.querySelectorAll("[data-delete]").forEach(function(btn){
          btn.addEventListener("click", function(){
            const id = btn.getAttribute("data-delete");
            if(confirm("এই পোস্টটি ডিলিট করতে চান?")){
              db.collection("posts").doc(id).delete().then(loadPosts);
            }
          });
        });
      }).catch(function(error){
        postList.innerHTML = "<div class='empty-note'>লোড করতে সমস্যা হয়েছে: " + error.message + "</div>";
      });
    }

    // LOAD STUDENTS
    function loadStudents(){
      const studentList = document.getElementById("studentList");
      const studentsEmpty = document.getElementById("studentsEmpty");

      db.collection("students").orderBy("createdAt", "desc").get().then(function(snapshot){
        studentList.innerHTML = "";

        if(snapshot.empty){
          studentsEmpty.style.display = "block";
          return;
        }
        studentsEmpty.style.display = "none";

        snapshot.forEach(function(doc){
          const s = doc.data();
          const card = document.createElement("div");
          card.className = "student-card";
          card.innerHTML = `
            <div>
              <div class="s-name">${escapeHtml(s.name || "-")}</div>
              <div class="s-sub">${escapeHtml(s.phone || "-")}</div>
            </div>
            <div class="s-field"><span>Course</span>${escapeHtml(s.course || "-")}</div>
            <div class="s-field"><span>Email</span>${escapeHtml(s.email || "-")}</div>
            <div class="s-field"><span>Education</span>${escapeHtml(s.education || "-")}</div>
            <button class="icon-btn danger" data-del-student="${doc.id}" title="Delete">🗑</button>
          `;
          studentList.appendChild(card);
        });

        studentList.querySelectorAll("[data-del-student]").forEach(function(btn){
          btn.addEventListener("click", function(){
            const id = btn.getAttribute("data-del-student");
            if(confirm("এই আবেদনটি ডিলিট করতে চান?")){
              db.collection("students").doc(id).delete().then(loadStudents);
            }
          });
        });
      }).catch(function(error){
        studentList.innerHTML = "<div class='empty-note'>লোড করতে সমস্যা হয়েছে: " + error.message + "</div>";
      });
    }

    function escapeHtml(str){
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

  </script>

</body>
</html>

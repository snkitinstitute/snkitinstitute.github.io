<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Courses | SNK IT Institute</title>

  <meta name="description"
        content="SNK IT Institute-এর AI Powered Professional Courses. Practical skills শিখুন এবং career-ready হন.">

  <meta name="theme-color" content="#050505">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>
    /* =========================================================
       SNK IT INSTITUTE
       ULTRA PREMIUM COURSE PAGE
       ========================================================= */

    :root {
      --bg: #050505;
      --bg-soft: #0a0a0a;
      --card: #101010;
      --card-2: #151515;

      --text: #ffffff;
      --text-soft: #c8c8c8;
      --muted: #858585;

      --green: #b7ff00;
      --green-dark: #8bc500;

      --border: rgba(255,255,255,.09);
      --border-green: rgba(183,255,0,.25);

      --shadow:
        0 20px 60px rgba(0,0,0,.45);

      --radius: 22px;
      --container: 1240px;
    }

    /* ================= RESET ================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Hind Siliguri", sans-serif;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(183,255,0,.07),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 30%,
          rgba(183,255,0,.045),
          transparent 28%
        ),
        var(--bg);

      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 60px 60px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%
      );

      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    ::selection {
      background: var(--green);
      color: #000;
    }

    /* ================= SCROLLBAR ================= */

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--green);
    }

    /* ================= COMMON ================= */

    .container {
      width: min(
        calc(100% - 40px),
        var(--container)
      );

      margin: auto;
    }

    .hidden {
      display: none !important;
    }

    .green {
      color: var(--green);
    }

    /* ================= HEADER ================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(5,5,5,.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand img {
      width: 150px;
      height: auto;
      object-fit: contain;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .nav a {
      padding: 9px 13px;

      color: #cfcfcf;
      font-size: 14px;
      font-weight: 600;

      border-radius: 10px;

      transition:
        .25s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--green);
      background: rgba(183,255,0,.06);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      color: #ddd;
      background: rgba(255,255,255,.04);

      border: 1px solid var(--border);
      border-radius: 12px;

      transition: .25s ease;
    }

    .icon-btn:hover {
      color: var(--green);
      border-color: var(--border-green);
      background: rgba(183,255,0,.07);
    }

    .login-btn {
      padding: 10px 15px;

      border: 1px solid var(--border);
      border-radius: 11px;

      font-family: Inter, sans-serif;
      font-size: 13px;
      font-weight: 600;

      color: #fff;
      background: rgba(255,255,255,.04);

      transition: .25s ease;
    }

    .login-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }

    .signup-btn {
      padding: 10px 17px;

      border: 1px solid var(--green);
      border-radius: 11px;

      color: #000;
      background: var(--green);

      font-family: Inter, sans-serif;
      font-size: 13px;
      font-weight: 800;

      transition: .25s ease;
    }

    .signup-btn:hover {
      background: #d0ff63;
      transform: translateY(-1px);
    }

    .mobile-menu-btn {
      display: none;
    }

    /* ================= HERO ================= */

    .hero {
      padding:
        80px 0
        55px;
    }

    .hero-content {
      max-width: 850px;
      margin: auto;

      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 7px 13px;

      color: var(--green);
      background: rgba(183,255,0,.07);

      border: 1px solid var(--border-green);
      border-radius: 999px;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 20px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;

      background: var(--green);
      border-radius: 50%;

      box-shadow:
        0 0 15px var(--green);
    }

    .hero h1 {
      font-family: Inter, "Hind Siliguri", sans-serif;

      font-size: clamp(
        38px,
        6vw,
        70px
      );

      line-height: 1.08;
      letter-spacing: -2px;

      font-weight: 800;
    }

    .hero h1 span {
      color: var(--green);
    }

    .hero p {
      max-width: 650px;

      margin: 22px auto 0;

      color: var(--text-soft);

      font-size: 17px;
      line-height: 1.8;
    }

    /* ================= SEARCH ================= */

    .course-toolbar {
      margin-bottom: 35px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .search-box {
      position: relative;

      flex: 1;
      max-width: 520px;
    }

    .search-box input {
      width: 100%;

      height: 52px;

      padding:
        0 20px
        0 48px;

      color: #fff;
      background: rgba(255,255,255,.045);

      border: 1px solid var(--border);
      border-radius: 15px;

      outline: none;

      transition: .25s ease;
    }

    .search-box input::placeholder {
      color: #777;
    }

    .search-box input:focus {
      border-color: rgba(183,255,0,.45);

      box-shadow:
        0 0 0 4px rgba(183,255,0,.06);
    }

    .search-icon {
      position: absolute;

      left: 17px;
      top: 50%;

      transform: translateY(-50%);

      color: #777;
    }

    .course-count {
      color: #888;
      font-size: 14px;
      white-space: nowrap;
    }

    .course-count strong {
      color: var(--green);
    }

    /* ================= COURSES ================= */

    .courses-section {
      padding-bottom: 100px;
    }

    .course-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 24px;
    }

    /* ================= CARD ================= */

    .course-card {
      position: relative;

      display: flex;
      flex-direction: column;

      min-width: 0;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      border: 1px solid var(--border);
      border-radius: var(--radius);

      overflow: hidden;

      box-shadow: var(--shadow);

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .course-card:hover {
      transform: translateY(-7px);

      border-color:
        rgba(183,255,0,.35);

      box-shadow:
        0 30px 80px rgba(0,0,0,.6),
        0 0 0 1px rgba(183,255,0,.04);
    }

    /* ================= IMAGE ================= */

    .course-image {
      position: relative;

      width: 100%;
      aspect-ratio: 16 / 9;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #141414,
          #090909
        );
    }

    .course-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform .5s ease;
    }

    .course-card:hover
    .course-image img {
      transform: scale(1.06);
    }

    .course-image::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.7),
          transparent 60%
        );

      pointer-events: none;
    }

    .course-placeholder {
      width: 100%;
      height: 100%;

      display: grid;
      place-items: center;

      font-family: Inter, sans-serif;
      font-size: 42px;
      font-weight: 800;

      color: rgba(183,255,0,.18);

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(183,255,0,.12),
          transparent 50%
        ),
        #0b0b0b;
    }

    /* ================= BADGES ================= */

    .course-badge {
      position: absolute;

      top: 15px;
      left: 15px;

      z-index: 2;

      padding: 6px 10px;

      border-radius: 8px;

      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .3px;

      color: #000;
      background: var(--green);

      box-shadow:
        0 8px 25px rgba(183,255,0,.16);
    }

    .course-badge.urgent {
      color: #fff;
      background: #ef4444;
    }

    .course-badge.info {
      color: #000;
      background: var(--green);
    }

    /* ================= CARD BODY ================= */

    .course-body {
      display: flex;
      flex-direction: column;

      flex: 1;

      padding: 22px;
    }

    .course-category {
      margin-bottom: 8px;

      color: var(--green);

      font-family: Inter, sans-serif;
      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .course-title {
      min-height: 58px;

      color: #fff;

      font-size: 22px;
      font-weight: 700;

      line-height: 1.35;
    }

    .course-description {
      margin-top: 10px;

      color: #999;

      font-size: 14px;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    /* ================= META ================= */

    .course-meta {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 18px;
    }

    .meta-item {
      padding: 6px 9px;

      color: #aaa;
      background: rgba(255,255,255,.04);

      border: 1px solid rgba(255,255,255,.06);
